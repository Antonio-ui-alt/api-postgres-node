services:
  - type: web
    name: api-postgres-node
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: api-postgres-db
          property: connectionString

databases:
  - name: api-postgres-db
    plan: free
    databaseName: postgres
    user: postgres
